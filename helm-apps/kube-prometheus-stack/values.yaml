## Default prometheus-operator values for all environments

crds:
  enabled: false

## General
nameOverride: "mycompany"

defaultRules:
  rules:
    etcd: false
    kubeScheduler: false

## Alertmanager
alertmanager:
  enabled: true
  # Alertmanager UI
  # Exposed through the Envoy Gateway (helm-apps/gateway-api) using a Gateway API HTTPRoute.
  # TLS is terminated at the Gateway with the wildcard certificate of the local CA.
  ingress:
    enabled: false
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - alertmanager.mycompany.com
      parentRefs:
        - name: mycompany-gateway
          namespace: envoy-gateway-system
          sectionName: https

## Grafana
grafana:
  enabled: true

  plugins:
    - victoriametrics-logs-datasource
    - victoriametrics-metrics-datasource

  additionalDataSources:
  - name: VictoriaMetrics
    type: prometheus
    access: direct
    editable: true
    jsonData:
      tlsSkipVerify: true
    orgId: 1
    url: http://victoria-metrics-victoria-metrics-cluster-vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus/
    version: 1
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: direct
    editable: true
    jsonData:
      tlsSkipVerify: true
    orgId: 1
    url: http://victoria-logs-victoria-logs-cluster-vlselect.monitoring.svc.cluster.local:9471
    version: 1


  # Grafana UI
  # Exposed through the Envoy Gateway (helm-apps/gateway-api) using a Gateway API HTTPRoute.
  # TLS is terminated at the Gateway with the wildcard certificate of the local CA.
  ingress:
    enabled: false
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - grafana.mycompany.com
      parentRefs:
        - name: mycompany-gateway
          namespace: envoy-gateway-system
          sectionName: https


## Exporters
kubernetesServiceMonitors:
  enabled: true

kubeApiServer:
  enabled: false

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: false


## Prometheus operator
prometheusOperator:
  admissionWebhooks:
    enabled: true
  kubeletService:
    enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 400Mi
    requests:
      cpu: 100m
      memory: 200Mi


## Prometheus
prometheus:
  enabled: true
  # Prometheus UI
  # Exposed through the Envoy Gateway (helm-apps/gateway-api) using a Gateway API HTTPRoute.
  # TLS is terminated at the Gateway with the wildcard certificate of the local CA.
  ingress:
    enabled: false
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - prometheus.mycompany.com
      parentRefs:
        - name: mycompany-gateway
          namespace: envoy-gateway-system
          sectionName: https

  prometheusSpec:
    remoteWrite:
    - url: "http://victoria-metrics-victoria-metrics-cluster-vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus/"
      # Reference: 
      # https://www.alibabacloud.com/help/doc-detail/114516.htm
      # https://prometheus.io/docs/practices/remote_write/
      # https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#remotewritespec
      # https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#queueconfig
      remoteTimeout: "60s"
      queueConfig:
        # Number of samples to buffer per shard before we start dropping them.
        capacity: 20000
        # Maximum number of shards, i.e. amount of concurrency.
        maxShards: 30
        # Minimum number of shards.
        minShards: 5
        # Maximum number of samples per send.
        maxSamplesPerSend: 10000
        # Minimum amount of time to wait before retrying a failed request
        minBackoff: "10s"
        # Maximum amount of time to wait before retrying a failed request
        maxBackoff: "40s"
      tlsConfig:
        insecureSkipVerify: true
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.16.0
    resources:
      limits:
        cpu: 1024m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 500Mi
    externalLabels:
      cluster: kind-kind-multinodes
    replicas: 1
    scrapeInterval: 60s
    replicaExternalLabelName: "replica"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
  additionalServiceMonitors:
    - name: "kube-pires"
      jobLabel: "app_kubernetes_io_name"
      selector:
        matchLabels:
          app.kubernetes.io/name: kube-pires
      namespaceSelector:
        any: true
      endpoints:
        - port: "http"
          path: /metrics

thanosRuler:
  enabled: false
