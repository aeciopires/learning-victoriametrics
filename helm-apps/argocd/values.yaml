global:
  domain: argocd.mycompany.com
  # Default image used by all components
  image:
    # -- If defined, a repository applied to all Argo CD deployments
    repository: quay.io/argoproj/argocd
    # -- Overrides the global Argo CD image tag whose default is the chart appVersion
    tag: "v3.6.1"
    # -- If defined, a imagePullPolicy applied to all Argo CD deployments
    imagePullPolicy: IfNotPresent

configs:
  params:
    server.insecure: true

server:
  # ArgoCD is exposed through the Envoy Gateway using the HTTPRoute declared in
  # helm-apps/gateway-api/manifests/04-argocd-httproute.yaml. It can't use the chart HTTPRoute
  # (server.httproute) because ArgoCD is installed by run.sh before the Gateway API CRDs exist.
  # TLS is terminated at the Gateway, so the server runs in insecure (plain HTTP) mode (configs.params above).
  ingress:
    enabled: false
