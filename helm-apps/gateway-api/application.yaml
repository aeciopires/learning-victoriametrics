apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/app_deletion/
    - resources-finalizer.argocd.argoproj.io
# https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
# Plain Kubernetes manifests (no Helm chart): local CA (cert-manager), GatewayClass, Gateway,
# HTTP -> HTTPS redirect and the ArgoCD HTTPRoute. Requires the envoy-gateway and cert-manager apps.
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  # https://argo-cd.readthedocs.io/en/stable/user-guide/projects/
  project: default
  # https://argo-cd.readthedocs.io/en/stable/user-guide/directory/
  source:
    repoURL: https://github.com/aeciopires/learning-victoriametrics
    # Branch or tag name
    targetRevision: main
    path: helm-apps/gateway-api/manifests
  # https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    syncOptions:
    - CreateNamespace=true
