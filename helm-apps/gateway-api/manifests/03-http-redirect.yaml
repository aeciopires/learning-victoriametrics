# Redirects every HTTP request received by the "http" listener to HTTPS (301).
#
# Reference:
# https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: envoy-gateway-system
  annotations:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    # After the Gateway (wave 4): ArgoCD only reports an HTTPRoute as Healthy once a Gateway
    # accepts it, so in an earlier wave it would block the sync of the Gateway itself
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
  - name: mycompany-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
