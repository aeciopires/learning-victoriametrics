# Redirects every HTTP request received by the "http" listener to HTTPS (301).
#
# Reference:
# https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - name: mycompany-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
