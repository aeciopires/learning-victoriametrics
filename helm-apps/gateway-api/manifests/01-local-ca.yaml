# Local Certificate Authority (CA) managed by cert-manager.
#
# Let's Encrypt can't validate a private domain like mycompany.com running inside kind,
# so the Gateway HTTPS listener uses certificates signed by this local CA instead.
#
# Flow: selfsigned ClusterIssuer -> CA Certificate (secret mycompany-local-ca)
#       -> CA ClusterIssuer "mycompany-local-ca" -> Gateway certificates
#
# References:
# https://cert-manager.io/docs/configuration/selfsigned/#bootstrapping-ca-issuers
# https://cert-manager.io/docs/configuration/ca/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
  annotations:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "0"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mycompany-local-ca
  annotations:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "1"
  # A ClusterIssuer of type CA reads its secret from the cert-manager "cluster resource namespace"
  namespace: cert-manager
spec:
  isCA: true
  commonName: mycompany.com local CA
  secretName: mycompany-local-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mycompany-local-ca
  annotations:
    # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: mycompany-local-ca
